<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navya Gupta, Product sense</title>
<meta name="description" content="How Navya Gupta thinks about products, plus a collection of favorite websites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
/* Same reading column and fonts as the Projects page. Each .go button opens its own page. */
:root {
  --paper: #fffdfb;
  --ink: #2a1216;
  --maroon: #6b1a2b;
  --rose: #d9a5ae;
  --butter: #f3e3a6;
  --soft: #6e5a5d;
  --line: #eadfdc;
  --hand: "Reenie Beanie", "Bradley Hand", cursive;
  --type: "Courier Prime", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 16px / 1.65 var(--type);
  padding-block: 28px 80px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.wrap { width: min(920px, 100%); margin: 0 auto; }
a { color: var(--maroon); }
.back { font-size: 13px; letter-spacing: 0.18em; text-decoration: none; }
.back:hover, .back:focus-visible { text-decoration: underline; }
h1 { margin: 28px 0 0; font: 400 clamp(52px, 9.5vw, 92px) / 0.9 var(--hand); color: var(--maroon); text-wrap: balance; }
.block { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); }
h2 { margin: 0 0 6px; font: 400 clamp(34px, 4.6vw, 48px) / 1.05 var(--hand); color: var(--maroon); }
.block > p { margin: 0; max-width: 62ch; }
.go { display: block; margin-top: 28px; padding: 22px 26px; border: 1.5px solid var(--maroon); border-radius: 10px; text-decoration: none; color: var(--ink); transition: transform .15s ease, box-shadow .15s ease; }
.go:hover, .go:focus-visible { transform: translateY(-3px); box-shadow: 0 8px 14px rgba(42,18,22,.14); }
.go b { display: block; font: 400 clamp(30px, 4vw, 40px) / 1.05 var(--hand); color: var(--maroon); }
.go span { display: block; margin-top: 4px; font-size: 14px; letter-spacing: 0.04em; color: var(--soft); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.tile { display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: 1; padding: 18px; background: var(--butter); border: 1.5px solid var(--maroon); border-radius: 10px; text-decoration: none; color: var(--ink); transition: transform .15s ease, box-shadow .15s ease; }
.tile:hover, .tile:focus-visible { transform: translateY(-3px); box-shadow: 0 8px 14px rgba(42,18,22,.14); }
.tile svg { width: 38%; height: auto; }
.tile b { font: 400 clamp(26px, 4vw, 38px) / 1 var(--hand); color: var(--maroon); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; Home</a>

  <h1>Product sense</h1>

  <section class="block">
    <div class="tiles">
      <a class="tile" href="https://claude.ai/artifact/EWvkvbfsQhhqP2mKsPyeiG" target="_blank" rel="noopener" aria-label="Partiful teardown">
        <svg viewBox="0 0 80 80" aria-hidden="true"><path d="M14 66 30 26l24 24Z" fill="#d9a5ae" stroke="#2a1216" stroke-width="2.5" stroke-linejoin="round"/><path d="M58 14v8M66 22h-8M62 38l6-4M48 12l2 6" stroke="#6b1a2b" stroke-width="3" stroke-linecap="round"/><circle cx="66" cy="50" r="3" fill="#6b1a2b"/><circle cx="44" cy="30" r="3" fill="#2a1216"/></svg>
        <b>Partiful teardown</b>
      </a>
    </div>
    <a class="go" href="/product-sense/cool-websites">
      <b>Cool websites &rarr;</b>
      <span>How you can be inspired by them</span>
    </a>
  </section>
</div>
</body>
</html>
