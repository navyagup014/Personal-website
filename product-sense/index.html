<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navya Gupta, Product sense</title>
<meta name="description" content="How Navya Gupta thinks about products, plus a collection of favorite websites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
/* Same reading column and fonts as the Projects page. Each section is a <section class="block">.
   To add a website, add one line to the SITES list in the script at the bottom. */
:root {
  --paper: #fffdfb;
  --ink: #2a1216;
  --maroon: #6b1a2b;
  --rose: #d9a5ae;
  --butter: #f3e3a6;
  --soft: #6e5a5d;
  --line: #eadfdc;
  --hand: "Reenie Beanie", "Bradley Hand", cursive;
  --type: "Courier Prime", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 16px / 1.65 var(--type);
  padding-block: 28px 80px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.wrap { width: min(920px, 100%); margin: 0 auto; }
a { color: var(--maroon); }
.back { font-size: 13px; letter-spacing: 0.18em; text-decoration: none; }
.back:hover, .back:focus-visible { text-decoration: underline; }
h1 { margin: 28px 0 0; font: 400 clamp(52px, 9.5vw, 92px) / 0.9 var(--hand); color: var(--maroon); text-wrap: balance; }
.block { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); }
h2 { margin: 0 0 6px; font: 400 clamp(34px, 4.6vw, 48px) / 1.05 var(--hand); color: var(--maroon); }
.block > p { margin: 0; max-width: 62ch; }
.list { list-style: disc; margin: 28px 0 0; padding-left: 22px; }
.list li { margin-bottom: 36px; padding-left: 4px; }
.list li::marker { color: var(--maroon); }
.list a { font-size: 15px; letter-spacing: 0.04em; overflow-wrap: anywhere; }
.list a::first-letter { text-transform: uppercase; }
.list img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: top; margin-top: 12px; background: var(--butter); border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; Home</a>

  <h1>Product sense</h1>

  <section class="block" id="cool-websites">
    <h2>Cool websites</h2>
    <p>A semi-regularly updated collection of some of my favorite websites on the internet.</p>
    <ul class="list" id="sites"></ul>
  </section>
</div>

<script>
// Add a site by adding its URL to this list. Screenshots are fetched live by thum.io when the page loads.
const SITES = [
  "https://aidanjs.com",
  "https://bfcm.stripe.com",
  "https://www.chloeyan.me/ferry",
  "https://laxspace.co",
  "https://plasticlist.org",
  "https://posthog.com",
  "https://randoma11y.com",
  "https://rotating.parts",
  "https://ryo.lu",
  "https://press.stripe.com",
  "https://tempo.xyz",
  "https://www.yukiasakura.com",
  "https://virgilabloh.com",
];
document.getElementById("sites").innerHTML = SITES.map(u => {
  const label = u.replace(/^https?:\/\/(www\.)?/, "");
  return `<li><a href="${u}" target="_blank" rel="noopener">${label}</a>
    <a href="${u}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img loading="lazy" alt="Screenshot of ${label}" src="https://image.thum.io/get/width/1200/crop/675/noanimate/${u}"></a></li>`;
}).join("");
</script>
</body>
</html>
