<style>
/* Layout: a ring of nine same-size hand-drawn objects around a handwritten hello.
   Each object is a link; hovering swaps the small typed caption under the hello. */
:root {
  --paper: #faf9f6; /* off-white */
  --frame: #62212c;
  --ink: #2a1216;
  --maroon: #6b1a2b;
  --rose: #d9a5ae;
  --butter: #f3e3a6;
  --soft: #6e5a5d;
  --line: #eadfdc;
  --hand: "Site Title", "Adobe Caslon Pro", "Libre Caslon Text", Georgia, serif;
  --type: "Site Body", Avenir, "Avenir Next", "Nunito Sans", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--type);
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Simple line frame around the page. */
body::after { content: ""; position: fixed; inset: 0; z-index: 50; pointer-events: none; border: 10px solid var(--frame); }
@media (max-width: 719px) { body::after { border-width: 6px; } }
.hero { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; }


.stage {
  position: relative;
  width: min(1300px, 100%, 126vh);
  aspect-ratio: 11 / 8;
  container-type: inline-size; /* lets the hello scale with the stage (cqw) */
}
.hello {
  position: absolute;
  left: 50%; top: 49%;
  transform: translate(-50%, -50%);
  width: 60%;
  text-align: center;
  z-index: 1;
}
.hello h1 {
  margin: 0;
  font: 400 5.2cqw / 1.1 var(--hand);
  color: var(--maroon);
  text-wrap: balance;
}
.heart { width: 0.55em; height: 0.5em; margin-left: 0.18em; vertical-align: 0.05em; }
#cap {
  margin: 14px 0 0;
  font-size: clamp(12px, 1.2vw, 15px);
  letter-spacing: 0.18em;
  min-height: 1.4em;
}

.tile {
  position: absolute;
  left: var(--x); top: var(--y);
  width: var(--w);
  transform: rotate(var(--r)) scale(var(--s, 1));
  transition: transform 0.25s cubic-bezier(.3,1.4,.5,1);
  color: inherit;
  text-decoration: none;
  z-index: 2;
}
.tile svg {
  display: block; width: 100%; aspect-ratio: 1; height: auto; overflow: visible;
  filter: drop-shadow(0 6px 8px rgba(42, 18, 22, 0.14));
  animation: bob 6s ease-in-out infinite;
  animation-delay: var(--d, 0s);
}
@keyframes bob { 50% { transform: translateY(-6px); } }
.tile:hover, .tile:focus-visible { --r: 0deg !important; --s: 1.08; z-index: 3; }
.tile:focus-visible { outline: 2px dashed var(--maroon); outline-offset: 8px; border-radius: 8px; }
.tag {
  position: absolute; top: 100%; left: -8%; right: -8%; margin-top: 6px;
  font-size: clamp(11px, 1.35cqw, 16px); line-height: 1.25; letter-spacing: 0.06em; text-align: center;
  transform: rotate(calc(var(--r) * -1)); /* cancels the tile's tilt so the words sit level */
  opacity: 0; transition: opacity 0.2s; pointer-events: none;
}
.tile:hover .tag, .tile:focus-visible .tag { opacity: 1; }
.hand { font-family: var(--hand); }

/* record sleeve: click slides the vinyl out and spins it while the song plays */
button.tile { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
.disc { transition: transform 0.5s cubic-bezier(.3, 1.3, .5, 1); }
.rec.on .disc { transform: translateX(62px); }
.spin { transform-box: fill-box; transform-origin: center; }
.rec.on .spin { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#all[hidden] { display: none; }
#all { display: inline-block; margin-top: 8px; font-size: 12px; letter-spacing: 0.18em; color: var(--maroon); }
/* Spotify's own player, kept small. Fades in once the record is playing. */
.mini {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  width: min(300px, calc(100% - 32px)); height: 80px;
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 5;
}
.mini iframe { display: block; width: 100%; border: 0; }
.mini.show { opacity: 1; pointer-events: auto; }

@media (max-width: 719px) {
  .hero { place-items: start center; min-height: 0; }
  .stage { width: 100%; aspect-ratio: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 28px 16px; padding-block: 24px; }
  .hello { position: static; transform: none; width: auto; grid-column: 1 / -1; margin-bottom: 8px; }
  .hello h1 { font-size: 42px; }
  .tile { position: static; width: min(160px, 100%); justify-self: center; transform: none; }
  .tile svg { animation: none; } /* nine looping animations with shadows is a lot for a phone */
  .tag { opacity: 1; position: static; display: block; transform: none; margin-top: 10px; font-size: 13px; }
  .hello { order: -2; }
  .tile[href="/usc/"], .tile[href="/skills/"] { order: -1; } /* photo and skills side by side, as on desktop */
}
@media (prefers-reduced-motion: reduce) {
  .tile svg { animation: none; }
  .tile { transition: none; }
}
</style>

<script>

// Typed caption under the greeting: shows each tile's line on hover/focus, "now playing" while music runs.
const cap = document.getElementById("cap");
const rec = document.querySelector(".rec");
const all = document.getElementById("all");
const mini = document.getElementById("mini");
const SONG = "6qOEjO2IUD7PjtpsXawq0d";
let ctl, playing = false;

const say = (t) => (cap.firstChild.nodeValue = t);
const rest = () => say(playing ? (ctl ? "Now playing: girl on fire" : "Music plays on the live site") : cap.dataset.default);
document.querySelectorAll(".tile").forEach((t) => {
  const on = () => say(t === rec && playing ? "Pause the music" : t.dataset.cap);
  t.addEventListener("mouseenter", on); t.addEventListener("focus", on);
  t.addEventListener("mouseleave", rest); t.addEventListener("blur", rest);
});

// Spotify's iFrame API is heavy, so it only loads on the first click of the record.
window.onSpotifyIframeApiReady = (api) =>
  api.createController(document.getElementById("embed"), { uri: "spotify:track:" + SONG, width: "100%", height: 80 }, (c) => {
    ctl = c;
    c.addListener("playback_update", (e) => {
      playing = !e.data.isPaused;
      rec.classList.toggle("on", playing);
      all.hidden = !playing;
      rest();
    });
    c.play(); // ponytail: some browsers block this; the player stays visible so one tap on it works
  });

let loading = false;
rec.addEventListener("click", () => {
  if (ctl) return ctl.togglePlay();
  mini.classList.add("show");
  if (loading) return;
  loading = true;
  const s = document.createElement("script");
  s.src = "https://open.spotify.com/embed/iframe-api/v1";
  s.async = true;
  s.onerror = () => { playing = !playing; rec.classList.toggle("on", playing); mini.classList.remove("show"); loading = false; rest(); }; // offline or sandboxed: the record just animates
  document.head.append(s);
});
</script>
