/* Layout: same reading column as the other pages. A handwritten header, then a loose grid
   of polaroids, best first. To add a photo, copy one <figure> into the grid, most professional photos first, and change the img and alt.
   The script below deals the photos into columns left to right so the order reads across each row. */
:root {
  --paper: #fffdfb;
  --ink: #2a1216;
  --maroon: #6b1a2b;
  --rose: #d9a5ae;
  --hand: "Reenie Beanie", "Bradley Hand", cursive;
  --type: "Courier Prime", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 16px / 1.65 var(--type);
  padding-block: 28px 80px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.wrap { width: min(1080px, 100%); margin: 0 auto; }
a { color: var(--maroon); }
.back { font-size: 13px; letter-spacing: 0.18em; text-decoration: none; }
.back:hover, .back:focus-visible { text-decoration: underline; }
h1 { margin: 28px 0 0; font: 400 clamp(52px, 9.5vw, 92px) / 0.9 var(--hand); color: var(--maroon); }
.sub { margin: 14px 0 0; font-size: 14px; letter-spacing: 0.18em; }
.grid { columns: 3 240px; column-gap: 28px; margin-top: 48px; }
figure { margin: 0 0 32px; padding: 12px 12px 28px; break-inside: avoid; background: #fffdfb; border: 2px solid var(--ink); box-shadow: 0 8px 14px rgba(42,18,22,.14); transform: rotate(var(--r, -1.5deg)); }
figure:nth-child(even) { --r: 1.5deg; }
figure:nth-child(3n) { --r: -.6deg; }
figure img { display: block; width: 100%; height: auto; }
.grid.cols { columns: auto; display: flex; gap: 28px; align-items: flex-start; }
.col { flex: 1; min-width: 0; }

<script>
// Deals the figures into 1, 2 or 3 columns round-robin, so best-first reads across each row.
// Without JS the CSS columns above still show every photo.
const grid = document.querySelector(".grid");
const figs = [...grid.children];
function layout() {
  const n = innerWidth < 560 ? 1 : innerWidth < 860 ? 2 : 3;
  if (grid.dataset.n == n) return;
  grid.dataset.n = n; grid.classList.add("cols"); grid.replaceChildren();
  const cols = Array.from({ length: n }, () => grid.appendChild(Object.assign(document.createElement("div"), { className: "col" })));
  figs.forEach((f, i) => cols[i % n].appendChild(f));
}
layout(); addEventListener("resize", layout);
</script>
