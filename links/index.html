/* Layout: same reading column as the other pages. Handwritten header with a drawn laptop, a short intro,
   then one row per project: status (left) / what it is (right). To add a project, copy a .row. */
:root {
  --paper: #fffdfb;
  --ink: #2a1216;
  --maroon: #6b1a2b;
  --rose: #d9a5ae;
  --butter: #f3e3a6;
  --soft: #6e5a5d;
  --line: #eadfdc;
  --hand: "Site Title", "Adobe Caslon Pro", "Libre Caslon Text", Georgia, serif;
  --type: "Site Body", Avenir, "Avenir Next", "Nunito Sans", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 16px / 1.65 var(--type);
  padding-block: 28px 80px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.wrap { width: min(920px, 100%); margin: 0 auto; }
a { color: var(--maroon); }
.back { font-size: 13px; letter-spacing: 0.18em; text-decoration: none; }
.back:hover, .back:focus-visible { text-decoration: underline; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 28px; }
header > div { min-width: 0; }
h1 { margin: 0; font: 400 clamp(46px, 8.4vw, 80px) / 1.28 var(--hand); color: var(--maroon); text-wrap: balance; }
.art { width: clamp(110px, 18vw, 180px); flex: none; transform: rotate(-6deg); filter: drop-shadow(0 6px 8px rgba(42,18,22,.14)); }
.lede { margin: 28px 0 0; max-width: 58ch; }
.rows { margin-top: 40px; }
.row { display: grid; grid-template-columns: 200px 1fr; gap: 6px 40px; padding-block: 28px; border-top: 1px solid var(--line); }
.row:last-child { border-bottom: 1px solid var(--line); }
.k { font-size: 13px; letter-spacing: 0.08em; color: var(--soft); }
h2 { margin: 0 0 6px; font: 400 clamp(28px, 3.8vw, 38px) / 1.28 var(--hand); }
.link-row h2 a { text-decoration: none; }
.link-row h2 a:hover, .link-row h2 a:focus-visible { text-decoration: underline; }
.row p { margin: 0; max-width: 62ch; }
@media (max-width: 719px) { .row { grid-template-columns: 1fr; } }
.link-row h2 { font-size: clamp(34px, 4.6vw, 48px); color: var(--maroon); }
.badge { display: inline-block; margin-top: 10px; padding: 2px 10px; border: 1.5px solid var(--maroon); border-radius: 99px; font-size: 12px; letter-spacing: 0.08em; color: var(--maroon); }
.row a.go { display: inline-block; margin-top: 10px; font-size: 14px; letter-spacing: 0.08em; }
</style>
